- name: Setup shell
  hosts: local
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true


- name: Setup Git
  hosts: local
  tasks:
    - name: Setup Git username
      community.general.git_config:
        name: user.name
        value: "{{ git.name }}"
        scope: global
        state: present
      environment:
        HOME: "{{ user_home }}"

    - name: Setup Git email
      community.general.git_config:
        name: user.email
        value: "{{ git.email }}"
        scope: global
        state: present
      environment:
        HOME: "{{ user_home }}"


- name: Setup Oh My Zsh
  hosts: local
  tasks:
    - name: Install Oh My Zsh
      ansible.builtin.shell: >
        sh -c "$(curl -fsSL {{ omz.install_url }})"
      args:
        creates: "{{ user_home }}/.oh-my-zsh"
      environment:
        HOME: "{{ user_home }}"

    - name: Install Oh My Zsh plugins
      ansible.builtin.git:
        clone: true
        repo: "{{ item.value.repo }}"
        dest: "{{ item.value.dest }}"
      loop: "{{ omz.plugins | dict2items }}"
      environment:
        HOME: "{{ user_home }}"

    - name: Set zsh as default shell
      become: true
      ansible.builtin.user:
        name: "{{ user }}"
        shell: /usr/bin/zsh


- name: Setup dotfiles
  hosts: local
  tasks:
    - name: Clone dotfiles repository
      ansible.builtin.git:
        repo: "{{ dotfiles.repo }}"
        dest: "{{ dotfiles.dest }}"
        clone: true
        update: true
      environment:
        HOME: "{{ user_home }}"

    - name: Link dotfiles
      ansible.builtin.file:
        src: "{{ dotfiles.dest }}/{{ item }}"
        dest: "{{ user_home }}/{{ item }}"
        state: link
        force: true
      loop: "{{ dotfiles.to_loop }}"


- name: Setup Neovim
  hosts: local
  become: true
  tasks:
    - name: Create Neovim installation directory
      ansible.builtin.file:
        path: /opt/nvim
        state: directory
        mode: "0755"

    - name: Download Neovim AppImage
      ansible.builtin.get_url:
        url: "{{ nvim.install_url }}"
        dest: /opt/nvim/nvim
        mode: "0755"
        force: false

    - name: Create Neovim symlink
      ansible.builtin.file:
        src: /opt/nvim/nvim
        dest: /usr/local/bin/nvim
        state: link
        force: true


- name: Setup Go tools
  hosts: local
  tasks:
    - name: Install gopls
      ansible.builtin.shell: |
        export PATH="$PATH:{{ user_home }}/go/bin"
        go install golang.org/x/tools/gopls@latest
      args:
        creates: "{{ user_home }}/go/bin/gopls"
      environment:
        HOME: "{{ user_home }}"

    - name: Install goimports
      ansible.builtin.shell: |
        export PATH="$PATH:{{ user_home }}/go/bin"
        go install golang.org/x/tools/cmd/goimports@latest
      args:
        creates: "{{ user_home }}/go/bin/goimports"
      environment:
        HOME: "{{ user_home }}"


- name: Setup NVM
  hosts: local
  tasks:
    - name: Install NVM
      ansible.builtin.shell: >
        curl -o- {{ node.nvm.install_url }} | bash
      args:
        creates: "{{ user_home }}/.nvm/nvm.sh"
      environment:
        HOME: "{{ user_home }}"
        NVM_NO_UPDATE_PROFILE: "1"

    - name: Install latest LTS Node.js
      ansible.builtin.shell: |
        source "{{ user_home }}/.nvm/nvm.sh"
        nvm install --lts
        nvm alias default 'lts/*'
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/.nvm/alias/default"
      environment:
        HOME: "{{ user_home }}"

    - name: Install Node tooling required by Neovim
      ansible.builtin.shell: |
        source "{{ user_home }}/.nvm/nvm.sh"
        npm install -g {{ nvim.npm_packages | join(' ') }}
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ user_home }}"
      changed_when: false


- name: Setup SDKMAN
  hosts: local
  tasks:
    - name: Install SDKMAN
      ansible.builtin.shell: >
        curl -s "{{ sdkman.install_url }}" | bash
      args:
        creates: "{{ user_home }}/.sdkman/bin/sdkman-init.sh"
      environment:
        HOME: "{{ user_home }}"

    - name: Install Java 21
      ansible.builtin.shell: |
        source "{{ user_home }}/.sdkman/bin/sdkman-init.sh"
        sdk install java 21-tem
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/.sdkman/candidates/java/21-tem"
      environment:
        HOME: "{{ user_home }}"


- name: Setup Python tooling
  hosts: local
  tasks:
    - name: Install Python tools
      ansible.builtin.shell: >
        python3 -m pip install --user --break-system-packages {{ nvim.pip_packages | join(' ') }}
      environment:
        HOME: "{{ user_home }}"
      changed_when: false


- name: Setup OpenCode
  hosts: local
  tasks:
    - name: Install OpenCode
      ansible.builtin.shell: >
        curl -fsSL {{ opencode.install_url }} | bash -s -- --no-modify-path
      args:
        creates: "{{ user_home }}/.opencode"
      environment:
        HOME: "{{ user_home }}"


- name: Setup pyenv
  hosts: local
  tasks:
    - name: Install pyenv
      ansible.builtin.shell: >
        curl -fsSL {{ pyenv.install_url }} | bash
      args:
        creates: "{{ user_home }}/.pyenv"
      environment:
        HOME: "{{ user_home }}"


- name: Wrap it up
  hosts: local
  tasks:
    - name: Print done message
      ansible.builtin.debug:
        msg: "Development environment setup complete"
