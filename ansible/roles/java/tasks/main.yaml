- name: java - install sdkman
  ansible.builtin.shell: >
    curl -s "{{ sdkman.install_url }}" | bash
  args:
    creates: "{{ user_home }}/.sdkman/bin/sdkman-init.sh"
  environment:
    HOME: "{{ user_home }}"

- name: java - install java
  ansible.builtin.shell: |
    source "{{ user_home }}/.sdkman/bin/sdkman-init.sh"
    sdk install java 21-tem
  args:
    executable: /bin/bash
    creates: "{{ user_home }}/.sdkman/candidates/java/21-tem"
  environment:
    HOME: "{{ user_home }}"
